services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalpa-proof-app
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
    volumes:
      # 持久化规则版本、词形映射与人工例外
      - proof-data:/app/server/data

  # 开发模式（热更新）：docker compose --profile dev up dev
  dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm dev
    container_name: catalpa-proof-dev
    ports:
      - "3000:3000"
      - "8787:8787"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm/store

volumes:
  proof-data:
  node_modules:
  pnpm_store:
